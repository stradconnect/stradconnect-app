<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17684f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>STRAD CONNECT ANALYTICS | User</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="lock-screen" class="lock hidden">
    <div class="lock-card">
      <div class="lock-mark">SC</div>
      <h1>Access Restricted</h1>
      <p>This area is reserved for the platform owner.</p>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-brand">
        <div class="topbar-mark">SC</div>
        <div>
          <strong>STRAD CONNECT</strong>
          <small>Analytics</small>
        </div>
      </div>
      <nav class="topbar-nav" id="navLinks"></nav>
    </div>
    <div class="topbar-actions">
      <span id="accessBadge" class="access-badge"></span>
      <button id="refreshBtn" class="btn-refresh">Refresh</button>
      <button id="logoutBtn" class="btn-logout">Sign Out</button>
    </div>
  </header>

  <main class="container" id="mainContent">
    <div class="drill-head">
      <a class="back-link" href="users.html">&larr; Back to Users</a>
      <div class="drill-title">
        <div class="avatar gold" id="userAvatar" style="width:44px;height:44px;font-size:15px;">?</div>
        <div>
          <h1 id="userTitle">User</h1>
          <p class="page-sub" id="userSub"></p>
        </div>
      </div>
    </div>

    <section class="info-grid" id="userKpis"></section>

    <section class="panel">
      <h2>Projects</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Project</th>
              <th>Location</th>
              <th>Type</th>
              <th>Role</th>
              <th>Status</th>
              <th>Since</th>
              <th>Their Comments</th>
            </tr>
          </thead>
          <tbody id="userProjectsTable"><tr><td colspan="7" class="muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Recent Comments</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Drawing</th>
              <th>Project</th>
              <th>Comment</th>
              <th>When</th>
            </tr>
          </thead>
          <tbody id="userCommentsTable"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <script src="user.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
