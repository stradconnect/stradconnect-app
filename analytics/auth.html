<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17684f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>STRAD CONNECT ANALYTICS | Sign In</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-dark);
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 12px;
      padding: 34px 30px;
      border-top: 4px solid var(--gold);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .auth-logo { text-align: center; margin-bottom: 20px; }
    .auth-mark {
      width: 52px; height: 52px; margin: 0 auto 12px;
      border-radius: 11px; background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px;
      border: 1px solid rgba(239,183,90,0.5);
      box-shadow: 0 0 0 3px rgba(239,183,90,0.12);
    }
    .auth-logo h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
    .auth-logo p { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .auth-error {
      background: #fdeceb; color: #b3261e; border: 1px solid #f5c6c3;
      font-size: 13px; border-radius: 7px; padding: 9px 12px; margin-bottom: 14px;
    }
    .auth-error.hidden { display: none; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 12px;
      border: 1px solid var(--line); border-radius: 7px;
      font-size: 14px; outline: none;
    }
    .field input:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(23,104,79,0.15); }
    .auth-submit {
      width: 100%; margin-top: 6px;
      background: var(--green); color: #fff; border: 0;
      padding: 12px; border-radius: 8px;
      font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .auth-submit:hover { background: #0f4e3a; }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-note { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
    .auth-back { display: block; text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--green); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-mark">SC</div>
        <h1>STRAD CONNECT ANALYTICS</h1>
        <p>Owner Access</p>
      </div>
      <div id="authError" class="auth-error hidden"></div>
      <form id="authForm" autocomplete="on">
        <div class="field">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" placeholder="owner@email.com" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="Password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="authSubmit" class="auth-submit">Sign In</button>
      </form>
      <p class="auth-note">Restricted area — only the platform owner can access analytics.</p>
      <a href="../index.html" class="auth-back">Back to public site</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = "https://addkzbtpzuujghpidplu.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_GS-TjYrkZ88-aL01RpaUAg_m5z-RlJI";
    var OWNER_EMAIL = "stradconnect@gmail.com";
    var supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    var form = document.getElementById("authForm");
    var emailInput = document.getElementById("authEmail");
    var passwordInput = document.getElementById("authPassword");
    var submitBtn = document.getElementById("authSubmit");
    var errEl = document.getElementById("authError");

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove("hidden");
    }

    if (!supabase) {
      showError("Analytics is temporarily unavailable. Please try again.");
      submitBtn.disabled = true;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!supabase) return;
      errEl.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      var email = emailInput.value.trim();
      var password = passwordInput.value;

      supabase.auth.signInWithPassword({ email: email, password: password })
        .then(function (res) {
          if (res.error) throw res.error;
          var userEmail = String((res.data.user && res.data.user.email) || "").toLowerCase().trim();
          if (userEmail !== OWNER_EMAIL) {
            return supabase.auth.signOut().then(function () {
              showError("This account is not authorized for analytics access.");
              submitBtn.disabled = false;
              submitBtn.textContent = "Sign In";
            });
          }
          window.location.href = "index.html";
        })
        .catch(function (err) {
          showError(err && err.message ? err.message : "Sign in failed.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        });
    });
  </script>
</body>
</html>
