<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7A5E" />
      <stop offset="100%" stop-color="#0F4E3A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Logomark Group: The Truss 'S' -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Cross bracing (Coordination/Data Flow) -->
    <path d="M 30 75 L 130 15 M 130 75 L 30 135" stroke="#7FB79F" stroke-width="6" stroke-linecap="round" />

    <!-- Gold accent cross-brace (key node highlight) -->
    <path d="M 30 75 L 130 15" stroke="#EFB75A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Main Structural Path -->
    <path d="M 130 15 L 30 15 L 30 75 L 130 75 L 130 135 L 30 135" fill="none" stroke="#12231E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stakeholder Nodes -->
    <circle cx="130" cy="15" r="10" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="30" cy="15" r="10" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="30" cy="75" r="10" fill="#EFB75A" stroke="#ffffff" stroke-width="3"/>
    <circle cx="130" cy="75" r="10" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="130" cy="135" r="10" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="30" cy="135" r="10" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Typography Group -->
  <g transform="translate(240, 122)">
    <!-- Main Brand Name : Michroma -->
    <text x="0" y="0" font-family="'Michroma','Segoe UI',system-ui,Arial,sans-serif">
      <tspan font-weight="700" font-size="44" letter-spacing="1" fill="#12231E">STRAD</tspan>
      <tspan font-weight="700" font-size="44" letter-spacing="1" fill="#17684F">CONNECT</tspan>
    </text>

    <!-- Gold underline accent -->
    <rect x="2" y="14" width="150" height="5" rx="2.5" fill="#EFB75A" />

    <!-- Platform Subtitle -->
    <text x="3" y="42" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-weight="700" font-size="12.5" fill="#5F6B66" letter-spacing="8">CONNECT &#183; COORDINATE &#183; BUILD</text>
  </g>
</svg>
